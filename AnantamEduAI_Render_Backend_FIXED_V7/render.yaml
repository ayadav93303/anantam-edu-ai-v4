services:
  - type: web
    name: anantam-edu-ai-v4
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
